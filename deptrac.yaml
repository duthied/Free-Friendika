# Dependency direction check for src/.
#
# Code dependencies point the same way as our foreign keys, never back.
# The tiers are described in doc/en/developer/php-architecture.md.
#
#   Delivery  ->  Features  ->  Domain  ->  Base
#
# Feature packages must not import each other, they talk via the event bus.
# Today's violations are frozen in deptrac-baseline.yaml, so only new upward or sideways imports fail.
# A tier is a property of a class, not a folder: Content/ keeps Feature and Domain classes next to its renderers.

imports:
    - deptrac-baseline.yaml

deptrac:
    paths:
        - ./src

    layers:
        # --- Composition root -------------------------------------------------
        # Wires every tier together, so it may use all of them.
        # Nothing may use it: new classes take constructor injection instead of DI::.
        - name: Bootstrap
          collectors:
              - type: classLike
                value: ^Friendica\\(App|DI|Core\\Console)$

        # --- Tier 0: Base -----------------------------------------------------
        # Plumbing and framework primitives. Uses nothing above.
        - name: Base
          collectors:
              - type: directory
                value: src/App/.*
              - type: directory
                value: src/Capabilities/.*
              - type: bool
                must:
                    - type: directory
                      value: src/Core/.*
                must_not:
                    - type: layer
                      value: Bootstrap
              - type: directory
                value: src/Database/.*
              - type: directory
                value: src/Event/.*
              - type: directory
                value: src/Network/.*
              - type: directory
                value: src/Render/.*
              - type: directory
                value: src/System/.*
              - type: directory
                value: src/Util/.*
              - type: classLike
                value: ^Friendica\\(AppHelper|AppLegacy|Base(Collection|DataTransferObject|Entity|Factory|Repository))$

        # --- Tier 1: Domain ---------------------------------------------------
        # The core nouns everything else points at. Uses Base only.
        - name: Domain
          collectors:
              - type: directory
                value: src/Model/.*
              - type: directory
                value: src/Post/.*
              - type: directory
                value: src/Federation/.*
              # post-media and contact reads that live next to their renderers
              - type: directory
                value: src/Content/(Contact|Post)/(Collection|Entity|Factory|Repository)/.*

        # --- Tier 2: Features -------------------------------------------------
        # One layer per feature package, so cross-feature imports are violations.
        - name: Feature/Channel
          collectors:
              - type: directory
                value: src/Content/Conversation/(Collection|Entity|Factory|Repository)/.*
        - name: Feature/Contact
          collectors:
              - type: directory
                value: src/Contact/.*
        - name: Feature/Moderation
          collectors:
              - type: directory
                value: src/Moderation/.*
        - name: Feature/Navigation
          collectors:
              - type: directory
                value: src/Navigation/.*
        - name: Feature/Privacy
          collectors:
              - type: directory
                value: src/Privacy/.*
        - name: Feature/Profile
          collectors:
              - type: directory
                value: src/Profile/.*
        - name: Feature/Security
          collectors:
              - type: directory
                value: src/Security/.*
        - name: Feature/User
          collectors:
              - type: directory
                value: src/User/.*

        # --- Tier 3: Delivery -------------------------------------------------
        # Handles a request or a job. Nothing depends on it.
        # The frozen top-level buckets (Object/, Factory/, Collection/) are mostly API DTOs.
        # They live here until they are folded into features.
        - name: Delivery
          collectors:
              - type: directory
                value: src/Collection/.*
              - type: directory
                value: src/Console/.*
              - type: bool
                must:
                    - type: directory
                      value: src/Content/.*
                must_not:
                    - type: directory
                      value: src/Content/(Contact|Conversation|Post)/(Collection|Entity|Factory|Repository)/.*
              - type: directory
                value: src/Factory/.*
              - type: directory
                value: src/Module/.*
              - type: directory
                value: src/Object/.*
              - type: directory
                value: src/Protocol/.*
              - type: directory
                value: src/Worker/.*
              - type: classLike
                value: ^Friendica\\(BaseModule|LegacyModule)$

    ruleset:
        Bootstrap:
            - Delivery
            - Feature/Channel
            - Feature/Contact
            - Feature/Moderation
            - Feature/Navigation
            - Feature/Privacy
            - Feature/Profile
            - Feature/Security
            - Feature/User
            - Domain
            - Base

        Base: ~

        Domain:
            - Base

        Feature/Channel: &feature
            - Domain
            - Base
        Feature/Contact: *feature
        Feature/Moderation: *feature
        Feature/Navigation: *feature
        Feature/Privacy: *feature
        Feature/Profile: *feature
        Feature/Security: *feature
        Feature/User: *feature

        Delivery:
            - Feature/Channel
            - Feature/Contact
            - Feature/Moderation
            - Feature/Navigation
            - Feature/Privacy
            - Feature/Profile
            - Feature/Security
            - Feature/User
            - Domain
            - Base
